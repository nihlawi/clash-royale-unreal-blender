#include "EnemyWaveManager.h"

#include "BaseTroop.h"
#include "GameFramework/Actor.h"
#include "Kismet/GameplayStatics.h"

AEnemyWaveManager::AEnemyWaveManager()
{
    PrimaryActorTick.bCanEverTick = true;
}

void AEnemyWaveManager::BeginPlay()
{
    Super::BeginPlay();
    QueueWave();
}

void AEnemyWaveManager::Tick(float DeltaTime)
{
    Super::Tick(DeltaTime);

    Accumulator += DeltaTime;
    if (Accumulator >= SpawnInterval)
    {
        Accumulator = 0.f;
        if (WaveIndex < MaxQueue)
        {
            SpawnNextEnemy();
            WaveIndex++;
        }
    }
}

void AEnemyWaveManager::QueueWave()
{
    WaveIndex = 0;
    Accumulator = 0.f;
}

void AEnemyWaveManager::SpawnNextEnemy()
{
    if (UnitsToSpawn.Num() == 0 || SpawnPoints.Num() == 0)
    {
        return;
    }

    TSubclassOf<ABaseTroop> EnemyClass = UnitsToSpawn[FMath::RandRange(0, UnitsToSpawn.Num() - 1)];
    if (!EnemyClass)
    {
        return;
    }

    FVector SpawnLocation = SpawnPoints[FMath::RandRange(0, SpawnPoints.Num() - 1)];
    FActorSpawnParameters Params;
    Params.SpawnCollisionHandlingOverride = ESpawnActorCollisionHandlingMethod::AdjustIfPossibleButAlwaysSpawn;

    ABaseTroop* Spawned = GetWorld()->SpawnActor<ABaseTroop>(EnemyClass, SpawnLocation, FRotator::ZeroRotator, Params);
    if (Spawned)
    {
        Spawned->TeamName = TEXT("Red");
    }
}
